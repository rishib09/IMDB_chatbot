[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imdb-chatbot"
version = "0.1.0"
description = "Eval-driven IMDb RAG reliability harness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "streamlit>=1.30",
    "httpx>=0.27",
    "numpy>=1.26",
    "faiss-cpu>=1.8",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
# The real embedder pulls sentence-transformers (and torch). Kept OUT of the
# base deps so tests and CI stay light; install with ".[embed]" to build a real
# semantic index.
embed = [
    "sentence-transformers>=2.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/imdb_chatbot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
