# Live test tier (ticket #69): real OpenRouter calls, nightly + on demand.
#
# The encrypted .env is committed; DOTENV_PRIVATE_KEY (repo secret) lets dotenvx
# decrypt it, so the live tests run with the real OPENROUTER_API_KEY. The corpus
# and the FAISS index are NOT in the repo (about 108 MB, gitignored), so every
# index-dependent live test self-skips here with a named reason - full live
# coverage runs locally, where tests/conftest.py resolves the local corpus and
# index (override with IMDB_TEST_CORPUS / IMDB_TEST_INDEX). This job still
# proves the marker gating, the resource discovery, and the key plumbing end to
# end on a fresh checkout.
name: Live

on:
  schedule:
    - cron: "0 3 * * *" # nightly, 03:00 UTC
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Live tier
        env:
          DOTENV_PRIVATE_KEY: ${{ secrets.DOTENV_PRIVATE_KEY }}
        run: npx @dotenvx/dotenvx run -f .env -- pytest -m live -q
